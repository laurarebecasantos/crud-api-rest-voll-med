version: '3.8'

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_SECRET:-vollmed123}
      MYSQL_DATABASE: voll_med_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_vollmed_data:/var/lib/mysql
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysql -uroot -p${DB_SECRET:-vollmed123} -e 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/voll_med_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_SECRET: ${DB_SECRET:-vollmed123}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  mysql_vollmed_data:
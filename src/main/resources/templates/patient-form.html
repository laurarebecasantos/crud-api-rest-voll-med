<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voll.med - Novo Paciente</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar">
        <div>
            <span class="brand">Voll.med</span>
            <a th:href="@{/web/dashboard}">Dashboard</a>
            <a th:href="@{/web/doctors}">Medicos</a>
            <a th:href="@{/web/patients}">Pacientes</a>
            <a th:href="@{/web/appointments}">Consultas</a>
        </div>
        <div>
            <span sec:authentication="name">User</span>
            <a th:href="@{/logout}">Sair</a>
        </div>
    </nav>

    <div class="container">
        <h1 style="margin-bottom: 1.5rem;">Cadastrar Paciente</h1>

        <div class="card">
            <div id="successMsg" class="alert alert-success" style="display:none;">Paciente cadastrado com sucesso!</div>
            <div id="errorMsg" class="alert alert-danger" style="display:none;"></div>

            <form id="patientForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="name">Nome *</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email *</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="phone">Telefone *</label>
                        <input type="text" id="phone" name="phone" required>
                    </div>
                    <div class="form-group">
                        <label for="cpf">CPF * (11 digitos)</label>
                        <input type="text" id="cpf" name="cpf" pattern="[0-9]{11}" maxlength="11" required>
                    </div>
                </div>

                <h3 style="margin: 1.5rem 0 1rem;">Endereco</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label for="street">Rua *</label>
                        <input type="text" id="street" name="street" required>
                    </div>
                    <div class="form-group">
                        <label for="neighborhood">Bairro *</label>
                        <input type="text" id="neighborhood" name="neighborhood" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="zipCode">CEP * (8 digitos)</label>
                        <input type="text" id="zipCode" name="zipCode" pattern="[0-9]{8}" maxlength="8" required>
                    </div>
                    <div class="form-group">
                        <label for="number">Numero</label>
                        <input type="text" id="number" name="number">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="city">Cidade *</label>
                        <input type="text" id="city" name="city" required>
                    </div>
                    <div class="form-group">
                        <label for="state">Estado *</label>
                        <input type="text" id="state" name="state" maxlength="2" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="complement">Complemento</label>
                    <input type="text" id="complement" name="complement">
                </div>

                <div style="margin-top: 1.5rem; display: flex; gap: 1rem;">
                    <button type="submit" class="btn btn-success">Salvar</button>
                    <a th:href="@{/web/patients}" class="btn btn-danger">Cancelar</a>
                </div>
            </form>
        </div>
    </div>

    <script th:src="@{/js/patient-form.js}"></script>
</body>
</html>

spring.application.name=vollmed-api
server.port=8082

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/voll_med_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_SECRET:vollmed123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

api.security.token.secret=${JWT_SECRET:minha-chave-secreta-temporaria}